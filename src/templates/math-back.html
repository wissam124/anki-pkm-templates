<!-- PKM SJ Math -->
<div class="prettify-flashcard">
  <div class="prettify-deck" data-prettify-order="0">{{Deck}}</div>
  <div class="prettify-metadata" data-prettify-order="10">
    {{#Source}}<div class="prettify-metadata__source">{{Source}}</div>{{/Source}}
    {{#Section}}<div class="prettify-metadata__section">{{Section}}</div>{{/Section}}
  </div>
  {{#Tags}}<div class="prettify-tags" data-prettify-order="20">{{clickable:Tags}}</div>{{/Tags}}
  <div class="prettify-field prettify-field--front" data-prettify-order="1">{{edit:Front}}</div>
  <hr class="prettify-divider" id="answer" data-prettify-order="2" />
  <div class="prettify-field prettify-field--back" data-prettify-order="3">{{edit:Back}}</div>
  {{#Extra}}
  <hr class="prettify-divider prettify-divider--extra" data-prettify-order="4" />
  <div class="prettify-field prettify-field--extra" data-prettify-order="5">{{Extra}}</div>
  {{/Extra}}
</div>

<!-- @enhance -->
